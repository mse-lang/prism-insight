name: Personal desk
on:
  push:
    branches: [personal-kr-paper]
    paths: ['personal/**', 'start-personal.cmd', '.github/workflows/personal-desk.yml']
  pull_request:
    paths: ['personal/**', 'start-personal.cmd', '.github/workflows/personal-desk.yml']
jobs:
  paper-desk:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s personal -p "test_*.py" -v
